# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "phasehaplotag"
description: Call 5mC modifications, co-phase SNVs, SVs and modifications, and tag
  reads by haplotype with LongPhase.
keywords:
  - phase
  - haplotag
  - methylation
  - longphase
  - long-read
components:
  - longphase/modcall
  - longphase/phase
  - longphase/haplotag
input:
  - ch_input:
      type: file
      description: |
        Aligned reads (with MM/ML tags for modcall), SNV calls and optional SV calls ([] if none)
        Structure: [ val(meta), path(bam), path(bai), path(snvs), path(svs) ]
      pattern: "*.{bam,bai,vcf,vcf.gz}"
  - ch_fasta:
      type: file
      description: |
        Reference genome
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}"
  - ch_fai:
      type: file
      description: |
        Reference genome index
        Structure: [ val(meta), path(fai) ]
      pattern: "*.fai"
output:
  - bam:
      type: file
      description: |
        Haplotagged reads (HP/PS tags)
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - snv_vcf:
      type: file
      description: |
        Phased SNVs
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*.vcf.gz"
  - sv_vcf:
      type: file
      description: |
        Phased SVs, when SVs were given
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*_SV.vcf.gz"
  - mod_vcf:
      type: file
      description: |
        Phased modifications
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*_mod.vcf.gz"
  - modcall_vcf:
      type: file
      description: |
        Unphased modification calls from modcall
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*.vcf.gz"
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
