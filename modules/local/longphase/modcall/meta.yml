# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "longphase_modcall"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "longphase":
      description: "LongPhase is an ultra-fast program for simultaneously co-phasing
        SNPs, small indels, large SVs, and (5mC) modifications for Nanopore and PacBio
        platforms."
      homepage: "https://github.com/twolinin/longphase/blob/v2.1.1/README.md"
      documentation: "https://github.com/twolinin/longphase/blob/v2.1.1/README.md"
      tool_dev_url: "https://github.com/twolinin/longphase"
      doi: ""
      licence: ["GPL v3"]
      identifier: null

input:
  ### TODO nf-core: Add a description of all of the variables used as input
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_2573" # CRAM
          - edam: "http://edamontology.org/format_3462" # SAM

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bam":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
            - edam: "http://edamontology.org/format_2573" # CRAM
            - edam: "http://edamontology.org/format_3462" # SAM
  versions_longphase:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "longphase":
          type: string
          description: The name of the tool
      - "longphase --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - longphase:
          type: string
          description: The name of the tool
      - longphase --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
